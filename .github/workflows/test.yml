name: PostgreSQL Extension Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [12, 13, 14, 15, 16, 17, 18]

    steps:
    - uses: actions/checkout@v4

    - name: Install PostgreSQL ${{ matrix.postgres }}
      run: |
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo wget --quiet -O /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
        sudo apt-get update
        sudo apt-get install -y postgresql-${{ matrix.postgres }} postgresql-server-dev-${{ matrix.postgres }}

    - name: Start PostgreSQL
      run: |
        PG_VERSION=${{ matrix.postgres }}
        sudo pg_ctlcluster "$PG_VERSION" main status >/dev/null 2>&1 || sudo pg_ctlcluster "$PG_VERSION" main start
        PGPORT=$(pg_lsclusters --no-header | awk -v v="$PG_VERSION" '$1==v && $4=="online" {print $3; exit}')
        if [ -z "$PGPORT" ]; then echo "PostgreSQL $PG_VERSION main cluster is not online" >&2; exit 1; fi
        sudo -u postgres "/usr/lib/postgresql/$PG_VERSION/bin/createuser" -s "${USER:-$(id -un)}" --port="$PGPORT"

    - name: Build extension
      run: |
        make clean || true
        make PG_CONFIG="/usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_config"

    - name: Install extension
      run: |
        sudo make install PG_CONFIG="/usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_config"

    - name: Run tests
      run: |
        export PATH="/usr/lib/postgresql/${{ matrix.postgres }}/bin:$PATH"
        PGPORT=$(pg_lsclusters --no-header | awk -v v="${{ matrix.postgres }}" '$1==v && $4=="online" {print $3; exit}')
        make installcheck PG_CONFIG="/usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_config" PGPORT="$PGPORT"

    - name: Show regression results on failure
      if: failure()
      run: |
        if [ -f regression.diffs ]; then
          echo "=== Regression test failures ==="
          cat regression.diffs
        fi
        if [ -d results ]; then
          echo "=== Test results ==="
          find results -name "*.out" -exec echo "=== {} ===" \; -exec cat {} \;
        fi
